<!--
  Wazuh Windows Agent Configuration Template
  File location: C:\Program Files (x86)\ossec-agent\ossec.conf

  Problem this solves:
    After installing the Wazuh agent on Windows, the agent may not appear
    in the Wazuh dashboard. The default config ships with a placeholder
    manager IP (0.0.0.0). Without the correct address, the agent cannot
    establish a connection (Error 1208 in Windows Event Viewer).

  Fix:
    1. Replace 192.168.8.249 below with your actual Wazuh manager IP.
    2. Save the file.
    3. Restart the Wazuh service:
         net stop wazuh
         net start wazuh
       Or via services.msc -> Wazuh -> Restart

  Result: Agent should appear with green status in the Wazuh dashboard
  within 30-60 seconds of restarting the service.
-->

<ossec_config>
  <client>
    <server>
      <address>192.168.8.249</address>  <!-- Replace with your Wazuh manager IP -->
      <port>1514</port>
      <protocol>tcp</protocol>
    </server>
    <config-profile>windows</config-profile>
    <notify_time>10</notify_time>
    <time-reconnect>60</time-reconnect>
    <auto_restart>yes</auto_restart>
  </client>

  <logging>
    <log_format>plain</log_format>
  </logging>

  <!-- Windows event log monitoring -->
  <localfile>
    <location>Security</location>
    <log_format>eventchannel</log_format>
  </localfile>

  <localfile>
    <location>System</location>
    <log_format>eventchannel</log_format>
  </localfile>

  <localfile>
    <location>Application</location>
    <log_format>eventchannel</log_format>
  </localfile>
</ossec_config>
